<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="notification" class="notification"></div>
    <!-- Header -->

    <header>

        <h1>Employee Management System</h1>

        <p>
            Manage your employees efficiently
        </p>

    </header>


    <main>

        <!-- Dashboard -->

        <section class="dashboard">

            <div class="card">
                <h3>Total Employees</h3>
                <p id="totalEmployees">0</p>
            </div>

            <div class="card">
                <h3>IT Department</h3>
                <p id="itEmployees">0</p>
            </div>

            <div class="card">
                <h3>HR Department</h3>
                <p id="hrEmployees">0</p>
            </div>

            <div class="card">
                <h3>Finance</h3>
                <p id="financeEmployees">0</p>
            </div>

            <div class="card">
                <h3>Total Salary</h3>
                <p id="totalSalary">₹0</p>
            </div>

            <div class="card">
                <h3>Average Salary</h3>
                <p id="averageSalary">₹0</p>
            </div>

        </section>

        <!-- Employee Form -->

        <section class="employee-form">

            <h2>Add Employee</h2>


            <form id="employeeForm">

                <div>

                    <label for="name">
                        Employee Name
                    </label>

                    <input type="text" id="name" placeholder="Enter employee name" required>

                </div>


                <div>

                    <label for="email">
                        Email
                    </label>

                    <input type="email" id="email" placeholder="Enter email" required>

                </div>


                <div>

                    <label for="phone">
                        Phone
                    </label>

                    <input type="tel" id="phone" placeholder="Enter phone number" maxlength="10">

                </div>


                <div>

                    <label for="department">
                        Department
                    </label>

                    <select id="department" required>

                        <option value="">
                            Select Department
                        </option>

                        <option value="IT">
                            IT
                        </option>

                        <option value="HR">
                            HR
                        </option>

                        <option value="Finance">
                            Finance
                        </option>

                        <option value="Marketing">
                            Marketing
                        </option>

                        <option value="Sales">
                            Sales
                        </option>

                    </select>

                </div>


                <div>

                    <label for="salary">
                        Salary
                    </label>

                    <input type="number" id="salary" placeholder="Enter salary" min="0" required>

                </div>


                <div>

                    <label for="joiningDate">
                        Joining Date
                    </label>

                    <input type="date" id="joiningDate" required>

                </div>


                <div class="form-buttons">

                    <button type="submit" id="submitButton">

                        Add Employee

                    </button>


                    <button type="button" id="cancelButton" class="cancel-button" style="display:none;">

                        Cancel

                    </button>

                </div>

            </form>

        </section>


        <!-- Employee List -->

        <section class="employee-list">

            <div class="list-header">

                <h2>Employee List</h2>

                <div class="filters">

                    <input type="text" id="search" placeholder="Search employee...">

                    <select id="departmentFilter">

                        <option value="">All Departments</option>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Finance">Finance</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Sales">Sales</option>

                    </select>

                </div>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Phone</th>

                            <th>Department</th>

                            <th>Salary</th>

                            <th>Joining Date</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="employeeTableBody">

                        <tr>

                            <td colspan="8">
                                Loading...
                            </td>

                        </tr>

                    </tbody>


                </table>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
